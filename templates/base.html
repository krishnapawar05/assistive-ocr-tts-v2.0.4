<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Vision Assist — Assistive OCR &amp; Speech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css?v={{ assets['style.css'] }}" rel="stylesheet">
</head>
<body id="body">
  <!-- Accessibility Skip Link -->
  <a href="#mainContent" class="skip-link">Skip to main content</a>

  <!-- Top Accessible Header -->
  <header class="app-header" role="banner">
    <div class="container-fluid d-flex flex-wrap align-items-center justify-content-between py-2 px-3">
      <div class="d-flex align-items-center">
        <h1 class="app-title m-0">
          <span aria-hidden="true">👁️</span> Smart Vision Assist
          <span class="version-tag">v2.0.4</span>
        </h1>
      </div>
      
      <!-- Quick Keyboard Hints for Assistive Users -->
      <div class="shortcut-hints d-none d-md-flex align-items-center text-muted" aria-label="Keyboard shortcuts guide">
        <span class="me-3"><kbd>Space</kbd> Start/Pause</span>
        <span class="me-3"><kbd>R</kbd> Replay</span>
        <span><kbd>Esc</kbd> Stop Speech</span>
      </div>

      <!-- Accessibility Toggles -->
      <div class="accessibility-controls d-flex align-items-center">
        <button id="contrastToggle" class="btn btn-outline-dark me-2" aria-pressed="false" aria-label="Toggle high contrast display mode">
          <span aria-hidden="true">🌓</span> High Contrast
        </button>
        <button id="increaseFont" class="btn btn-outline-secondary" aria-pressed="false" aria-label="Toggle large font size">
          <span aria-hidden="true">A+</span> Large Font
        </button>
      </div>
    </div>
  </header>

  <!-- Main Landmark -->
  <main id="mainContent" class="container-fluid px-3 py-3" role="main">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Accessibility visual toggles
    const body = document.getElementById('body');
    const contrastBtn = document.getElementById('contrastToggle');
    const fontBtn = document.getElementById('increaseFont');

    if (contrastBtn) {
      contrastBtn.addEventListener('click', function() {
        body.classList.toggle('high-contrast');
        const isHighContrast = body.classList.contains('high-contrast');
        this.setAttribute('aria-pressed', String(isHighContrast));
        if (isHighContrast) {
          this.classList.remove('btn-outline-dark');
          this.classList.add('btn-warning');
        } else {
          this.classList.remove('btn-warning');
          this.classList.add('btn-outline-dark');
        }
      });
    }

    if (fontBtn) {
      fontBtn.addEventListener('click', function() {
        body.classList.toggle('large-font');
        this.setAttribute('aria-pressed', String(body.classList.contains('large-font')));
      });
    }
  </script>
</body>
</html>
