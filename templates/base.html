<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Smart Vision Assist — AI-powered assistive reading tool for visually impaired students. Point your camera at text and it reads aloud automatically." />
  <title>Smart Vision Assist — Assistive Reading</title>

  <!-- Preconnect for font performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="/static/style.css?v={{ assets['style.css'] }}" rel="stylesheet" />
</head>
<body id="body">

  <!-- Accessibility: Skip Link -->
  <a href="#mainContent" class="skip-link">Skip to main content</a>

  <!-- Screen Reader Live Region (non-spamming, polite) -->
  <div id="srLiveAnnouncements" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- APP HEADER                                              -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <header class="app-header" role="banner">
    <div class="app-header-inner">

      <!-- Brand -->
      <div class="brand" role="img" aria-label="Smart Vision Assist — Assistive Reading Tool">
        <div class="brand-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Smart Vision Assist</div>
          <div class="brand-tagline">Assistive Reading Tool</div>
        </div>
      </div>

      <!-- System status (centre) -->
      <div class="system-status" role="status" aria-label="System status" aria-live="polite">
        <div class="status-dot offline" id="statusDot" aria-hidden="true"></div>
        <span id="statusText">Ready</span>
      </div>

      <!-- Keyboard hints + Accessibility controls -->
      <div class="header-controls">
        <div class="kbd-hints" aria-label="Keyboard shortcuts">
          <span><kbd>Space</kbd> Start / Pause</span>
          <span><kbd>R</kbd> Replay</span>
          <span><kbd>Esc</kbd> Stop</span>
        </div>

        <button id="contrastToggle" class="icon-btn" aria-pressed="false" aria-label="Toggle high contrast display mode">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="M12 2v20M12 2a10 10 0 0 1 0 20"/>
          </svg>
          <span>Contrast</span>
        </button>

        <button id="increaseFont" class="icon-btn" aria-pressed="false" aria-label="Toggle large font size">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>
          </svg>
          <span>Large Font</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- MAIN CONTENT                                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <main id="mainContent" class="app-main" role="main">
    {% block content %}{% endblock %}
  </main>

  <script>
    // ── Accessibility Toggles ────────────────────────────────
    const body = document.getElementById('body');

    const contrastBtn = document.getElementById('contrastToggle');
    if (contrastBtn) {
      contrastBtn.addEventListener('click', function () {
        const on = body.classList.toggle('high-contrast');
        this.setAttribute('aria-pressed', String(on));
        // Persist across page navigation (session-level only)
        try { sessionStorage.setItem('sva-contrast', on ? '1' : ''); } catch (_) {}
      });
    }

    const fontBtn = document.getElementById('increaseFont');
    if (fontBtn) {
      fontBtn.addEventListener('click', function () {
        const on = body.classList.toggle('large-font');
        this.setAttribute('aria-pressed', String(on));
        try { sessionStorage.setItem('sva-largefont', on ? '1' : ''); } catch (_) {}
      });
    }

    // Restore preferences
    try {
      if (sessionStorage.getItem('sva-contrast'))   { body.classList.add('high-contrast'); contrastBtn && contrastBtn.setAttribute('aria-pressed','true'); }
      if (sessionStorage.getItem('sva-largefont'))  { body.classList.add('large-font');    fontBtn && fontBtn.setAttribute('aria-pressed','true'); }
    } catch (_) {}
  </script>
</body>
</html>
