# nixpacks.toml — Railway Nixpacks build for Smart Vision Assist
[phases.setup]
nixPkgs = [
  "python310",
  "gcc",
  "libGL",
  "glib",
  "espeak-ng",
  "tesseract",
  "libsndfile"
]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "pip install -r requirements-railway.txt"
]

[phases.build]
cmds = []

[variables]
RAILWAY_ENVIRONMENT = "production"
PYTHONUNBUFFERED = "1"
DISABLE_MODEL_SOURCE_CHECK = "1"

[start]
cmd = "python app.py"
